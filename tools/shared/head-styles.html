<script>
{{#home}}
  // Motion is opt-in: only hide-then-reveal content when JS runs and the visitor allows motion.
{{/home}}
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('has-motion');
    try { if (sessionStorage.getItem('forge-pt')) { sessionStorage.removeItem('forge-pt'); document.documentElement.classList.add('pt-in'); } } catch (e) {}
{{#home}}
    // Safety net: if the motion script fails to load, show the static page. Deferred scripts always run before
    // DOMContentLoaded, so a slow first visit only waits for them; the 15s timer is the last resort.
{{/home}}
    var off = function () { if (!window.__forgeReady) document.documentElement.classList.remove('has-motion', 'pt-in'); };
    document.addEventListener('DOMContentLoaded', off);
    setTimeout(off, 15000);
  }
</script>
