<dialog class="lightbox" aria-label="Image viewer">
  <div class="lb-top"><span class="lb-count tnum"></span><button class="lb-btn lb-close" type="button" aria-label="Close viewer">✕</button></div>
  <div class="lb-stage"><img alt=""></div>
  <div class="lb-bottom">
    <button class="lb-btn lb-prev" type="button" aria-label="Previous image">←</button>
    <span class="lb-title"></span>
    <button class="lb-btn lb-next" type="button" aria-label="Next image">→</button>
  </div>
</dialog>
